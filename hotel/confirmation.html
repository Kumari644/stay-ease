<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirmation</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background:#eafaf1;
        }

        .confirm-box{
            width:400px;
            background:white;
            margin:120px auto;
            padding:40px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        .confirm-box img{
            width:100px;
            margin-bottom:20px;
        }

        .confirm-box h1{
            color:#27ae60;
            margin-bottom:10px;
        }

        .confirm-box p{
            color:#555;
            margin-bottom:20px;
        }

        .confirm-box a{
            display:inline-block;
            padding:10px 20px;
            background:#27ae60;
            color:white;
            text-decoration:none;
            border-radius:6px;
            transition:0.3s;
        }

        .confirm-box a:hover{
            background:#219150;
        }
    </style>
</head>

<body>

    <div class="confirm-box">
        <img src="success.png" alt="Success">
        <h1>Thank You! 🎉</h1>
        <p>Your message has been submitted successfully.</p>

        <a href="contact.html">Go Back</a>
    </div>

</body>
</html>
